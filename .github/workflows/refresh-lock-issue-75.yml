name: Refresh issue 75 lockfile

on:
  push:
    branches:
      - issue-75-pyerfa-transform

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-75-pyerfa-transform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Refresh lockfile
        run: uv lock
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uv.lock
          git commit -m "Refresh uv lock for PyERFA runtime dependency"
          git push origin HEAD:issue-75-pyerfa-transform
