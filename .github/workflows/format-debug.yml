name: Format debug

on:
  push:
    branches:
      - agent/issue-33-shared-math

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.15.2
      - run: ruff format --diff astrolabe/util/math.py
