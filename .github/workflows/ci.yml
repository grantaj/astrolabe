name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y indi-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra tools
      - name: Lint
        run: uv run ruff check .
      - name: Format probe
        run: |
          uv run ruff format .
          git diff -- astrolabe/cli/main.py astrolabe/services/focus.py tests/camera/test_pixels.py tests/cli/test_focus.py tests/services/test_focus.py tests/services/test_focus_image.py
      - name: Tests
        run: uv run pytest
