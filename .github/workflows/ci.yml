name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y indi-bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: Sync the core runtime install (locked)
        run: uv sync --frozen
      - name: Core-runtime smoke without Astropy or astroquery
        run: |
          uv run --no-sync python - <<'PY'
          import datetime
          import importlib.util
          import math

          for package in ("astropy", "astroquery"):
              assert importlib.util.find_spec(package) is None, (
                  f"core runtime unexpectedly contains {package}"
              )

          from astrolabe.mount.frame_transform import (
              IcrsCoordinate,
              epoch_of_date_to_icrs,
              icrs_to_epoch_of_date,
          )

          time_utc = datetime.datetime(
              2026, 8, 21, 12, 0, tzinfo=datetime.timezone.utc
          )
          source = IcrsCoordinate(ra_rad=1.2, dec_rad=0.4)
          epoch_of_date = icrs_to_epoch_of_date(source, time_utc)
          recovered = epoch_of_date_to_icrs(epoch_of_date, time_utc)

          ra_error = (recovered.ra_rad - source.ra_rad + math.pi) % math.tau - math.pi
          assert abs(ra_error) < 1e-12
          assert abs(recovered.dec_rad - source.dec_rad) < 1e-12
          PY
      - name: Sync the full supported install (locked)
        run: uv sync --frozen --all-extras
      - name: Full-install smoke without Astropy or astroquery
        run: |
          uv run --no-sync python - <<'PY'
          import datetime
          import importlib.util
          import math

          for package in ("astropy", "astroquery"):
              assert importlib.util.find_spec(package) is None, (
                  f"full supported install unexpectedly contains {package}"
              )

          from astrolabe.mount.frame_transform import (
              IcrsCoordinate,
              epoch_of_date_to_icrs,
              icrs_to_epoch_of_date,
          )

          time_utc = datetime.datetime(
              2026, 8, 21, 12, 0, tzinfo=datetime.timezone.utc
          )
          source = IcrsCoordinate(ra_rad=1.2, dec_rad=0.4)
          epoch_of_date = icrs_to_epoch_of_date(source, time_utc)
          recovered = epoch_of_date_to_icrs(epoch_of_date, time_utc)

          ra_error = (recovered.ra_rad - source.ra_rad + math.pi) % math.tau - math.pi
          assert abs(ra_error) < 1e-12
          assert abs(recovered.dec_rad - source.dec_rad) < 1e-12
          PY
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Live camera simulator integration
        run: |
          scripts/integration-entrypoint.sh --integration \
            tests/camera/test_indi_live_integration.py -s
